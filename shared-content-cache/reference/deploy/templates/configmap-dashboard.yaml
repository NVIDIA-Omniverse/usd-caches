{{- if $.Values.metrics.dashboard.include }}
{{- $files := .Files.Glob "dashboards/*.json" }}
{{- if $files }}
apiVersion: v1
kind: ConfigMapList
items:
{{- range $path, $fileContents := $files }}
{{- $dashboardName := regexReplaceAll "(^.*/)(.*)\\.json$" $path "${2}" }}
- apiVersion: v1
  kind: ConfigMap
  metadata:
    name: {{ include "chart.fullname" $ }}-{{ $dashboardName }}

    {{- if $.Values.metrics.dashboard.namespace.override }}
    namespace: {{ $.Values.metrics.dashboard.namespace.value }}
    {{- end }}

    labels:
      app: {{ include "chart.fullname" $ }}-grafana

{{ $.Values.metrics.dashboard.labels | toYaml | indent 6 }}
  data:
    {{ $dashboardName }}.json: {{ $.Files.Get $path | toJson }}
{{- end }}
{{- end }}
{{- end }}

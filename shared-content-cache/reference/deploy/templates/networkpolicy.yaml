{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chart.compatFullname" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.clientIngress | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.cache.containerPort }}
        {{- if .Values.nginx.backends.nucleus.include }}
        - protocol: TCP
          port: {{ .Values.service.nucleus.containerPort }}
        {{- end }}
        - protocol: TCP
          port: 13129
        {{- if .Values.metrics.prometheus.enabled }}
        - protocol: TCP
          port: 9145
        {{- end }}
    {{- if .Values.peer.enabled }}
    # The peer endpoint has no application-level client authentication.
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.service.peer.containerPort }}
    {{- end }}
{{- end }}

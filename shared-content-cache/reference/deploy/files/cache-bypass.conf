# Configures cache bypass logic for NGINX:
# - Uses a custom flag to bypass the cache only when 'no-cache' is explicitly present in
#   the Cache-Control header.
# - Allows other Cache-Control directives (e.g., 'private', 'no-store') to be managed by
#   NGINX's default caching logic.
# - By default, NGINX will cache both GET and HEAD requests, even if `proxy_cache_methods`
#   is set to GET only. The logic below disables cache for HEAD requests.
# - When versioning is required, requests without an If-Match header are not cached.

# The `disable_cache` variable is used by "lua-access.lua" to bypass the cache when
# there is a unrecoverable error when performing the access check.
set $disable_cache "0";

if ($request_method = HEAD) {
    set $disable_cache "1";
}

if ($http_cache_control ~* "no-cache") {
    set $disable_cache "1";
}

# Checks if versioning (If-Match header) is required.
# Backends set $requires_versioning from values.yaml (default: require).
if ($requires_versioning = "") {
    set $requires_versioning "1";
}

# Combines `requiresVersioning` policy with `If-Match` header presence to determine cache bypass.
# Uses string concatenation to avoid nested if blocks (not supported in NGINX).
set $versioning_check "${requires_versioning}-${http_if_match}";
if ($versioning_check = "1-") {
    set $disable_cache "1";
}

proxy_cache_bypass $disable_cache;

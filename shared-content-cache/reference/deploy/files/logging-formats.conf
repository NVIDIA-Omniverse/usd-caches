# Logging Configurations
#
# This file defines JSON log formats for different OVCC services.
# Each format is optimized for specific use cases and includes only relevant fields.
#
# Note: log_format only accepts literal strings; variables cause double-encoding issues.

# Default server logging format (minimal fields that are always populated)
# Used for fallback/default server requests
log_format default_log escape=json
'{'
    '"access_time":"$time_local",'
    '"remote_addr":"$remote_addr",'
    '"request":"$request_method",'
    '"scheme":"$scheme",'
    '"status":"$status",'
    '"bytes_sent":"$body_bytes_sent",'
    '"http_user_agent":"$http_user_agent",'
    '"host":"$host",'
    '"upstream_cache_status":"$upstream_cache_status",'
    '"connection":"$connection",'
    '"connection_requests":"$connection_requests",'
    '"request_uri":"$request_uri",'
    '"etag":"$http_if_match",'
    '"request_range":"$http_range",'
    '"has_auth_header":"$http_authorization_present",'
    '"request_time":"$request_time"'
{{- if .Values.otel.enabled }}
    # OpenTelemetry fields must be at the end to avoid JSON syntax issues.
    ',"otel_trace_id":"$otel_trace_id",'
    '"otel_span_id":"$otel_span_id",'
    '"otel_parent_id":"$otel_parent_id"'
{{- end }}
'}';

# Cloud backend logging format (S3, Azure, future Oracle/Google).
# Extended fields including optional ones that may be empty.
log_format cloud_backend_log escape=json
'{'
    '"access_time":"$time_local",'
    '"remote_addr":"$remote_addr",'
    '"request":"$request_method",'
    '"scheme":"$scheme",'
    '"status":"$status",'
    '"request_uri":"$request_uri",'
    '"host":"$host",'
    '"http_user_agent":"$http_user_agent",'
    '"connection":"$connection",'
    '"connection_requests":"$connection_requests",'
    '"ssl_protocol":"$ssl_protocol",'
    '"http_protocol":"$server_protocol",'
    '"upstream":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_cache_status":"$upstream_cache_status",'
    '"upstream_http_location":"$upstream_http_location",'
    '"upstream_connect_time":"$upstream_connect_time",'
    '"upstream_header_time":"$upstream_header_time",'
    '"upstream_response_time":"$upstream_response_time",'
    '"request_time":"$request_time",'
    '"bytes_sent":"$body_bytes_sent",'
    '"etag":"$http_if_match",'
    '"request_range":"$http_range",'
    '"has_auth_header":"$http_authorization_present",'
    '"http_x_request_id":"$http_x_request_id",'
    '"pod_name":"$hostname",'
    # Worker PID attributes a request to the worker that served it, which is how
    # a stall caused by blocking work on that same worker becomes visible.
    '"pid":"$pid",'
    '"request_length":"$request_length",'
    '"version":"{{ $.Chart.Version }}",'
    '"bursty_cache":"$bursty_cache",'
    '"disable_cache":"$disable_cache",'
    '"mutation_detected":"$mutation_detected"'
{{- if .Values.otel.enabled }}
    # OpenTelemetry fields must be at the end to avoid JSON syntax issues.
    ',"otel_trace_id":"$otel_trace_id",'
    '"otel_span_id":"$otel_span_id",'
    '"otel_parent_id":"$otel_parent_id"'
{{- end }}
'}';

# Nucleus-specific logging format
# Extends base format with Nucleus-specific fields
# Includes Omniverse content tracking and NCA identification
log_format nucleus_log escape=json
'{'
    '"access_time":"$time_local",'
    '"remote_addr":"$remote_addr",'
    '"remote_user":"$remote_user",'
    '"request":"$request_method",'
    '"scheme":"$scheme",'
    '"status":"$status",'
    '"request_uri":"$request_uri",'
    '"host":"$host",'
    '"connection":"$connection",'
    '"connection_requests":"$connection_requests",'
    '"ssl_protocol":"$ssl_protocol",'
    '"http_user_agent":"$http_user_agent",'
    '"proxy_host":"$proxy_host",'
    '"upstream":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_cache_status":"$upstream_cache_status",'
    '"upstream_http_location":"$upstream_http_location",'
    '"upstream_connect_time":"$upstream_connect_time",'
    '"upstream_header_time":"$upstream_header_time",'
    '"upstream_response_time":"$upstream_response_time",'
    '"request_time":"$request_time",'
    '"bytes_sent":"$body_bytes_sent",'
    '"etag":"$http_if_match",'
    '"request_range":"$http_range",'
    '"has_auth_header":"$http_authorization_present",'
    '"http_x_request_id":"$http_x_request_id",'
    # '"http_nvcf_function_id":"$http_nvcf_function_id",'  # TODO: Currently empty in production (likely a bug).
    # '"http_nvcf_version":"$http_nvcf_version"'           # TODO: Currently empty in production (likely a bug).
    '"http_omniverse_content_uid":"$http_omniverse_content_uid",'
    '"http_x_ov_uri":"$http_x_ov_uri",'
    '"http_omniverse_proxy_scheme":"$http_omniverse_proxy_scheme",'
    '"disable_cache":"$disable_cache"'
'}';


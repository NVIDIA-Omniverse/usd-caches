server {
    listen {{ $.Values.service.cache.containerPort }}{{ if $.Values.tls.enabled }} ssl{{ end }} default_server;
    {{- if $.Values.nginx.backends.passthrough.allowHttp2Clients }}
    http2 on;
    {{- end }}
    server_name _;

    # Access logging for passthrough server requests.
    access_log /dev/stdout default_log buffer={{ $.Values.nginx.logging.buffer }} flush={{ $.Values.nginx.logging.flushInterval }};

    location /healthz {
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }
    {{- if $.Values.nginx.backends.passthrough.allowCacheReset }}
    location = {{ include "func.cacheResetPath" $ }} {
        content_by_lua_file /etc/nginx/conf.d/lua-runtime/lua-generation.lua;
    }
    {{- $legacyCacheResetPath := include "func.legacyCacheResetPath" $ | trim -}}
    {{- if $legacyCacheResetPath }}
    location = {{ $legacyCacheResetPath }} {
        content_by_lua_file /etc/nginx/conf.d/lua-runtime/lua-generation.lua;
    }
    {{- end }}
    {{- end }}
    location / {
        proxy_pass {{ $.Values.nginx.backends.passthrough.proxyPass }};

        include /etc/nginx/conf.d/sites/cache-bypass.conf;
        {{- include "func.cacheGeneration" $ | indent 8 }}
    }
}

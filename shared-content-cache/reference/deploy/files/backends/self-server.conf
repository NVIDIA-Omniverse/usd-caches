{{- if $.Values.nginx.selfServer.enabled }}
{{- $fullname := include "chart.compatFullname" $ }}
{{- $ns := $.Release.Namespace }}
{{- $names := list
    $fullname
    (printf "%s.%s" $fullname $ns)
    (printf "%s.%s.svc" $fullname $ns)
    (printf "%s.%s.svc.cluster.local" $fullname $ns)
}}
{{- if $.Values.nginx.selfServer.extraNames }}
{{- $names = concat $names $.Values.nginx.selfServer.extraNames }}
{{- end }}
server {
    listen {{ $.Values.service.cache.containerPort }}{{ if $.Values.tls.enabled }} ssl{{ end }};
    {{- if $.Values.nginx.backends.nucleus.include }}
    listen {{ $.Values.service.nucleus.containerPort }}{{ if $.Values.tls.enabled }} ssl{{ end }};
    {{- end }}
    server_name {{ join " " $names }};
    access_log off;

    location / {
        default_type text/plain;
        return 421 "Misdirected Request\n";
    }
}
{{- end }}

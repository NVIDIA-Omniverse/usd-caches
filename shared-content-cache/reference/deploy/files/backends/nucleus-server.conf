{{- $config := $.Values.nginx.backends.nucleus }}
{{- if $config.include }}
server {
    listen {{ $.Values.service.nucleus.containerPort }}{{ if $.Values.tls.enabled }} ssl{{ end }};
    {{- if $config.allowHttp2Clients }}
    http2 on;
    {{- end }}
    server_name {{ $config.serverName }};

    # Access logging for Nucleus requests
    access_log /dev/stdout nucleus_log buffer={{ $.Values.nginx.logging.buffer }} flush={{ $.Values.nginx.logging.flushInterval }};

    # Enables content caching.
    proxy_cache {{ $config.proxyCacheName }};
    {{- range $code, $time := .Values.nginx.proxyCache.validity }}
    proxy_cache_valid {{ $code }} {{ $time }};
    {{- end }}

    # Cache Lock for nucleus operations.
    proxy_cache_lock_timeout 3s;
    proxy_cache_lock_age 10s;

    # Handle /omni/lft locations directly.
    location /omni/lft {
        {{- include "func.cacheGeneration" $ | indent 8 }}
        set $disable_cache "0";

        {{- if $config.bridgeResolver }}
        # Use Nucleus Bridge DNS resolver for connectivity.
        resolver {{ $config.bridgeResolver }} valid=60s;
        {{- end }}
        # NGINX sets Host to $proxy_host by default; the keepalive template
        # overrides it to $host. An explicit proxy_set_header Host here would
        # duplicate the header when upstream keepalive is enabled.
        # Client library knows what slices to use and we trust it with http_range.
        # Required headers for Nucleus LFT.
        proxy_set_header   X-OV-URI $http_x_ov_uri;
        proxy_set_header   Omniverse-Proxy-Scheme $http_omniverse_proxy_scheme;
        proxy_set_header   Omniverse-Content-Uid $http_omniverse_content_uid;
        # JWT for Nucleus Bridge.
        proxy_set_header   Omni-Tenant-Token $http_omni_tenant_token;

        # Cache key includes NCA ID and OVC 1 cache parameters.
        {{- include "func.upstreamKeepaliveResolve" $config | indent 8 }}
        {{- include "func.upstreamKeepaliveProxyPass" $config | indent 8 }}
        proxy_cache_key $cache_generation|$http_nvcf_nca_id|$request_method|$http_omniverse_content_uid|$http_range;

        # From OVC 1.
        add_header "Access-Control-Allow-Origin" "*";
        add_header "Access-Control-Allow-Headers" "*";
        add_header "Access-Control-Allow-Methods" "*";

        # Add cache status header for monitoring and testing.
        add_header "X-Cache-Status" $upstream_cache_status always;
    }

    # Handle generic forward proxy for Nucleus/LFT requests.
    location / {
        {{- include "func.cacheGeneration" $ | indent 8 }}
        set $disable_cache "0";

        # Do not cache requests that have auth headers - forward proxy can be used by multi-tenants.
        # Consider removing this restriction when nvcf_nca_id is passed down to the cache layer, which enables tenant specific caching.
        proxy_cache_bypass $http_authorization_present;

        # Remove the JWT Tenant Token - will not go through the bridge.
        proxy_set_header Omni-Tenant-Token "";

        # NGINX sets Host to $proxy_host by default; the keepalive template
        # overrides it to $host. An explicit proxy_set_header Host here would
        # duplicate the header when upstream keepalive is enabled.

        {{- include "func.upstreamKeepaliveResolve" $config | indent 8 }}
        {{- include "func.upstreamKeepaliveProxyPass" $config | indent 8 }}

        # Cache key includes NCA ID and generic uri with optional omniverse content uid and range as the content is not on Nucleus.
        proxy_cache_key $cache_generation|$http_nvcf_nca_id|$request_method|$host|$request_uri|$http_omniverse_content_uid|$http_range;
        # Add cache status header for monitoring and testing.
        add_header "X-Cache-Status" $upstream_cache_status always;
    }

    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }

    {{- if $.Values.nginx.backends.nucleus.allowCacheReset }}
    location = {{ include "func.cacheResetPath" $ }} {
        content_by_lua_file /etc/nginx/conf.d/lua-runtime/lua-generation.lua;
    }
    {{- $legacyCacheResetPath := include "func.legacyCacheResetPath" $ | trim -}}
    {{- if $legacyCacheResetPath }}
    location = {{ $legacyCacheResetPath }} {
        content_by_lua_file /etc/nginx/conf.d/lua-runtime/lua-generation.lua;
    }
    {{- end }}
    {{- end }}
}
{{- end }}

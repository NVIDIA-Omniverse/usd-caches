{{- $config := $.Values.nginx.backends.azure }}
{{- if $config.include }}
server {
    listen {{ $.Values.service.cache.containerPort }}{{ if $.Values.tls.enabled }} ssl{{ end }};
    {{- if $config.allowHttp2Clients }}
    http2 on;
    {{- end }}
    server_name {{ $config.serverName }};

    # Access logging for Azure requests.
    access_log /dev/stdout cloud_backend_log buffer={{ $.Values.nginx.logging.buffer }} flush={{ $.Values.nginx.logging.flushInterval }};

    # Enables content caching.
    proxy_cache {{ $config.proxyCacheName }};
    {{- range $code, $time := .Values.nginx.proxyCache.validity }}
    proxy_cache_valid {{ $code }} {{ $time }};
    {{- end }}

    include /etc/nginx/conf.d/sites/cacheability-overrides.conf;

    # Filters query arguments for the cache key by excluding parameters that do
    # not identify the object, so per-request signatures never fragment the key.
    # Three families are excluded:
    #   - Account/service SAS: sv, ss, srt, sp, sr, se, st, sig, spr, sip, si
    #   - User-delegation SAS: skoid, sktid, skt, ske, sks, skv, saoid, suoid, scid
    #   - Response-header overrides: rscc, rscd, rsce, rscl, rsct
    # Keys are sorted to ensure deterministic cache key generation.
    set_by_lua_block $filtered_args {
        local args = ngx.req.get_uri_args()
        local filtered = {}
        local keys = {}
        for k, v in pairs(args) do
            if k ~= "sv" and k ~= "ss" and k ~= "srt" and k ~= "sp" and k ~= "sr" and
               k ~= "se" and k ~= "st" and k ~= "sig" and k ~= "spr" and k ~= "sip" and k ~= "si" and
               k ~= "skoid" and k ~= "sktid" and k ~= "skt" and k ~= "ske" and k ~= "sks" and
               k ~= "skv" and k ~= "saoid" and k ~= "suoid" and k ~= "scid" and
               k ~= "rscc" and k ~= "rscd" and k ~= "rsce" and k ~= "rscl" and k ~= "rsct" then
                filtered[k] = v
                table.insert(keys, k)
            end
        end
        table.sort(keys)
        local parts = {}
        for _, k in ipairs(keys) do
            local v = filtered[k]
            if type(v) == "table" then
                for _, val in ipairs(v) do
                    table.insert(parts, ngx.escape_uri(k) .. "=" .. ngx.escape_uri(val))
                end
            else
                table.insert(parts, ngx.escape_uri(k) .. "=" .. ngx.escape_uri(v))
            end
        end
        return table.concat(parts, "&")
    }

    # Azure treats x-ms-range as the effective byte range when present and
    # otherwise falls back to Range. Canonicalizing both headers into one key
    # component keeps equivalent SDK and HTTP requests together while leaving
    # full-object keys unchanged.
    set_by_lua_block $azure_effective_range {
        local x_ms_range = ngx.var.http_x_ms_range
        if x_ms_range and x_ms_range ~= "" then
            return x_ms_range
        end
        return ngx.var.http_range or ""
    }

    # Separates Get Blob representations and request-derived checksum headers
    # while preserving the existing key for a plain full or ranged response.
    set_by_lua_block $azure_cache_variant {
        return require("lua-cache-key").azure_get_variant(
            ngx.req.get_headers(), ngx.var.azure_effective_range)
    }

    # Computes adaptive cache key component with priority-based selection.
    set_by_lua_block $adaptive_cache_key {
        -- Priority 1: Uses fn_id (with optional fn_version).
        local fn_id = ngx.var.http_nvcf_function_id
        if fn_id and fn_id ~= "" then
            local fn_version = ngx.var.http_nvcf_function_version or "-"
            return fn_id .. "|" .. fn_version
        end

        -- Priority 2: Uses nca_id as fallback.
        local nca_id = ngx.var.http_nvcf_nca_id
        if nca_id and nca_id ~= "" then
            return nca_id
        end

        -- Priority 3: Hashes the authorization header.
        local auth_header = ngx.var.http_authorization
        if auth_header and auth_header ~= "" then
            return ngx.md5(auth_header)
        end

        -- No identifying information available.
        return "-"
    }

    location / {
        rewrite_by_lua_block {
            -- Microsoft: If-Match takes precedence over If-Unmodified-Since.
            -- Preserve the original value for an upstream MISS, but keep
            -- NGINX's local HIT filter from evaluating the lower-priority date.
            -- https://learn.microsoft.com/en-us/rest/api/storageservices/specifying-conditional-headers-for-blob-service-operations
            local if_match = ngx.var.http_if_match
            local if_unmodified_since = ngx.var.upstream_if_unmodified_since
            if if_match and if_match ~= "" and
               if_unmodified_since and if_unmodified_since ~= "" then
                ngx.req.clear_header("If-Unmodified-Since")
            end

            {{- if and .Values.featureFlags.enableBurstyCache $config.burstyCache $config.burstyCache.rules }}
            local function should_use_bursty_cache()
                local method = ngx.var.request_method
                local uri = ngx.var.request_uri or ""

                {{- range $config.burstyCache.rules }}
                -- Rule: {{ .name }}
                if method == "{{ .method }}" and string.sub(uri, 1, {{ len .uriStartsWith }}) == "{{ .uriStartsWith }}" then
                    return true
                end
                {{- end }}

                return false
            end

            if should_use_bursty_cache() then
                return ngx.exec("@bursty_cache")
            end
            return ngx.exec("@proxy_cache")
            {{- else }}
            return ngx.exec("@proxy_cache")
            {{- end }}
        }
    }

    location @bursty_cache {
        internal;

        set $bursty_cache "1";
        set $disable_cache "1";  # Main cache is disabled for bursty cache.

        # Caches bursty responses for 1 hour to prevent repeated upstream requests during
        # simulation startup. The cache key includes NCA ID, Function ID, and Function
        # Version, ensuring each simulation gets isolated cache entries. The goal is
        # consistency within a simulation run, not reuse across runs.
        proxy_cache_valid 200 {{ $config.burstyCache.ttlSec }}s;
        proxy_cache_valid 404 {{ $config.burstyCache.ttlSec }}s;

        {{- include "func.upstreamKeepaliveResolve" $config | indent 8 }}
        {{- include "func.upstreamKeepaliveProxyPass" $config | indent 8 }}
        proxy_cache_key $cache_generation|$adaptive_cache_key|$host|$request_method|$request_uri;

        # Client must read these from environment variables and send as headers.
        # https://docs.nvidia.com/cloud-functions/user-guide/latest/cloud-function/function-creation.html#environment-variables
        # These headers are used for cache isolation but not sent upstream to Azure.
        proxy_set_header nvcf-function-id "";
        proxy_set_header nvcf-function-version "";
        proxy_set_header nvcf-nca-id "";

        {{- include "func.cacheGeneration" $ | indent 8 }}
    }

    location @proxy_cache {
        internal;

        set $proxy_auth_pass "{{ tpl $config.proxyAuthPass . }}";
        set $bursty_cache "0";
        set $requires_versioning "{{ include "func.backendRequiresVersioningVar" $config }}";
        set $upstream_etag "";
        set $upstream_last_modified "";
        set $mutation_detected "";
        include /etc/nginx/conf.d/sites/cache-bypass.conf;
        # If the customer provides encryption keys, OVCC always sends the request
        # to Azure and does not cache the decrypted response.
        if ($http_x_ms_encryption_key != "") {
            set $disable_cache "1";
        }
        if ($http_x_ms_encryption_key_sha256 != "") {
            set $disable_cache "1";
        }
        if ($http_x_ms_encryption_algorithm != "") {
            set $disable_cache "1";
        }
        proxy_no_cache
            $http_x_ms_encryption_key
            $http_x_ms_encryption_key_sha256
            $http_x_ms_encryption_algorithm;
        # Blob tags are independent of content freshness, so Azure must
        # evaluate tag conditions even when the content itself is immutable.
        if ($http_x_ms_if_tags != "") {
            set $disable_cache "1";
        }
        # Lease authorization is a separate concern from content freshness.
        # Azure must verify the current lease before OVCC returns content.
        if ($http_x_ms_lease_id != "") {
            set $disable_cache "1";
        }
        {{- include "func.cacheGeneration" $ | indent 8 }}
        header_filter_by_lua_block {
            {{- if eq (include "func.backendRequiresVersioningVar" $config) "0" }}
            require("lua-mutation").detect()
            {{- end }}
            require("lua-azure-response-overrides").apply()
        }

        {{- include "func.upstreamKeepaliveResolve" $config | indent 8 }}
        {{- include "func.upstreamKeepaliveProxyPass" $config | indent 8 }}
        proxy_cache_key $cache_generation|$host|$request_method|$uri|$filtered_args|$http_if_match|$azure_cache_variant;

        access_by_lua_file /etc/nginx/conf.d/lua-runtime/lua-access.lua;
    }

    {{- if $config.allowCacheReset }}
    location = {{ include "func.cacheResetPath" $ }} {
        content_by_lua_file /etc/nginx/conf.d/lua-runtime/lua-generation.lua;
    }
    {{- $legacyCacheResetPath := include "func.legacyCacheResetPath" $ | trim -}}
    {{- if $legacyCacheResetPath }}
    location = {{ $legacyCacheResetPath }} {
        content_by_lua_file /etc/nginx/conf.d/lua-runtime/lua-generation.lua;
    }
    {{- end }}
    {{- end }}

    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }
}
{{- end }}

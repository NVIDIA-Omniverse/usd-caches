# Sets $cache_generation during the rewrite phase so it participates in
# proxy_cache_key evaluation for both cache hits and misses.
#
# Why: On a cache hit, NGINX may skip later phases (e.g., access). If the
# variable is only assigned in access_by_lua, the cache key still uses an old
# value and the request wrongly hits the previous generation. Assigning the
# variable here ensures the key reflects the latest generation before the cache
# lookup.
#
# Where: This file must be included inside each backend's location block, before
# proxy_cache_key. Do not include it at the http/server level since the value
# needs to be assigned within the location rewrite phase.
#
# Behavior: Reads the current generation from the shared dictionary
# (lua_shared_dict cc_generation). Falls back to "0" when unset. After a
# client bumps the generation via {{ include "func.cacheResetPath" . }}, the next request will use
# a different cache key and observe a MISS, followed by a HIT on subsequent
# requests.

set_by_lua_block $cache_generation {
    local dict = ngx.shared.cc_generation
    local current = dict and dict:get("generation")
    if current and current ~= "" then
        return tostring(current)
    end
    return "0"
}

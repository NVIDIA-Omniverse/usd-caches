user nvs;
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
lock_file /tmp/nginx.lock;

{{- if (.Values.traces).enabled }}
load_module /usr/local/openresty/nginx/modules/ngx_otel_module.so;
{{- end }}

events {
    worker_connections {{ $.Values.nginx.workerConnections | default 1024 }};
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_names_hash_bucket_size 512;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;

    # A simulation may do 250,000 requests. Quadruple this for safety.
    # NGINX does not have a way to set unlimited keepalive requests.
    keepalive_requests {{ $.Values.nginx.keepaliveRequests | default 999999 }};
    # A client opens one stream for every 16MiB chunk of data. Assuming a single file could be 4GiB,
    # we should allow up to 256 streams per connection. Quadruple this for safety.
    http2_max_concurrent_streams {{ $.Values.nginx.http2MaxConcurrentStreams | default 1024 }};

    # Logging configurations. Logs presence of Authorization header without exposing the token.
    map $http_authorization $http_authorization_present {
        "" 0;
        default 1;
    }

    # A backend may need to hide this field from NGINX's local conditional
    # filter while still forwarding the customer's original value upstream.
    # Reading this mapped variable before clearing the request header preserves
    # that value for proxy_set_header.
    map $http_if_unmodified_since $upstream_if_unmodified_since {
        default $http_if_unmodified_since;
    }

    include /etc/nginx/conf.d/sites/logging-formats.conf;

    # Access logging uses 1MB buffers with 10s flush intervals for optimal performance.
    # See README.md for detailed analysis of this buffer strategy.

    lua_package_path '/etc/nginx/conf.d/lua-runtime/?.lua;;';

    {{- with .Values.nginx.sharedMemory.limits }}

    # Upstream balancer state (config, DNS cache, failure markers).
    lua_shared_dict upstreamBalancerCache {{ .upstreamBalancerCache }};

    # Shared cache for verified presigned URLs.
    lua_shared_dict presigned_url_cache {{ .presignedUrlCache }};

    # Shared dictionary for request-based locking mechanism.
    lua_shared_dict lock_by_request_uri_table {{ .lockByRequestUriTable }};
    {{- end }}

    # Cache Metrics are updated at every log request processing phase.
    lua_shared_dict cache_metrics {{ $.Values.metrics.cacheMetricsStorageSize | default "32m" }};

    # Shared dictionary for cache generation resets across requests (per-instance).
    # $cache_generation is set per-backend inside each location (rewrite phase)
    # via cache-generation.conf to ensure cache hits use the updated key.
    lua_shared_dict cc_generation 1m;

    # Cache Metrics.
    init_worker_by_lua_block {
        local metrics = require("lua-metrics")
        metrics.prometheus:gauge("instance_info", "{{ $.Chart.Name }}", {"chart_version"}):set(1, { "{{ $.Chart.Version }}" })
        metrics.init({
            {{- range $key, $value := .Values.metrics.buckets }}
            {{ printf "%s_bucket = { %s }," $key $value }}
            {{- end }}
        })

        ngx.shared.upstreamBalancerCache:set("config", {{ include "func.toSnakeCaseJson" $.Values.nginx.upstreamBalancer | quote }})
    }

    log_by_lua_block {
        local metrics = require("lua-metrics")

        local or_nil = function(value)
            if value ~= nil then
                return value
            end
            return "nil"
        end

        local cache_status = or_nil(ngx.var.upstream_cache_status)
        local http_status = or_nil(ngx.var.status)
        local request_method = or_nil(ngx.var.request_method)
        local host = ngx.var.host

        -- Only need metrics for proxied requests.
        local skip_metrics = false
        do
            -- Uses ngx.var.proxy_host as an indicator for "proxied" requests, since it is set by proxy_pass.
            -- Avoids referencing ngx.var.proxy_host if it is not set, thereby preventing warnings.
            local ok, proxy_host = pcall(function() return ngx.var.proxy_host end)
            if not ok or proxy_host == nil or proxy_host == "" then
                skip_metrics = true
            end
        end
        if skip_metrics then
            ngx.log(ngx.INFO, "skipping metrics")
            return
        end

        if ngx.var.bytes_received ~= nil then
            metrics.counter.bytes_rx:inc(tonumber(ngx.var.bytes_received))
        end
        if ngx.var.bytes_sent ~= nil then
            metrics.counter.bytes_tx:inc(tonumber(ngx.var.bytes_sent))
        end

        if ngx.var.body_bytes_sent ~= nil then
            metrics.histogram.response_size_bytes:observe(tonumber(ngx.var.body_bytes_sent), {host})
        end
        if ngx.var.upstream_connect_time ~= nil then
            metrics.counter.http_upstream_requests:inc(1, {host, request_method, cache_status, http_status})

            for num in ngx.var.upstream_connect_time:gmatch("(%d+%.%d+)") do
                metrics.histogram.upstream_connect_time:observe(tonumber(num), {host})
            end
        end
        if ngx.var.upstream_header_time ~= nil then
            for num in ngx.var.upstream_header_time:gmatch("(%d+%.%d+)") do
                metrics.histogram.upstream_header_time:observe(tonumber(num), {host})
            end
        end
        if ngx.var.upstream_response_time ~= nil then
            for num in ngx.var.upstream_response_time:gmatch("(%d+%.%d+)") do
                metrics.histogram.upstream_response_time:observe(tonumber(num), {host})
            end
        end
        if ngx.var.upstream_queue_time ~= nil then
            for num in ngx.var.upstream_queue_time:gmatch("(%d+%.%d+)") do
                metrics.histogram.upstream_queue_time:observe(tonumber(num), {host})
            end
        end
        if ngx.var.upstream_bytes_sent ~= nil then
            for num in ngx.var.upstream_bytes_sent:gmatch("(%d+%.%d+)") do
                metrics.histogram.upstream_bytes_sent:observe(tonumber(num), {host})
            end
        end
        if ngx.var.upstream_bytes_received ~= nil then
            for num in ngx.var.upstream_bytes_received:gmatch("(%d+%.%d+)") do
                metrics.histogram.upstream_bytes_received:observe(tonumber(num), {host})
            end
        end

        if ngx.var.tcpinfo_rtt ~= nil then
            metrics.histogram.tcpinfo_rtt:observe(tonumber(ngx.var.tcpinfo_rtt) / 1000000.0, {host})
        end
        if ngx.var.tcpinfo_rttvar ~= nil then
            metrics.histogram.tcpinfo_rttvar:observe(tonumber(ngx.var.tcpinfo_rttvar) / 1000000.0, {host})
        end
        if ngx.var.tcpinfo_snd_cwnd ~= nil then
            metrics.histogram.tcpinfo_snd_cwnd:observe(tonumber(ngx.var.tcpinfo_snd_cwnd), {host})
        end

        if ngx.var.request_time ~= nil then
            metrics.histogram.request_duration_seconds:observe(tonumber(ngx.var.request_time), {host})
        end

        metrics.counter.http_requests:inc(1, {host, request_method, cache_status, http_status})
    }

{{- if (.Values.traces).enabled }}
    # Configures the logical service name reported to the OTel collector,
    # and where to send trace data (local OTLP/gRPC collector).
    otel_service_name {{ $.Chart.Name }}-otel-service;
    otel_exporter {
        endpoint localhost:4317;
    }
{{- end }}

    {{- /* Construct minFreeByVolume (Volume Name -> Min Free String) */}}
    {{- $minFreeByVolume := dict -}}
    {{- range .Values.persistence.volumes -}}
      {{- $minFreeString := printf "%sg" (include "func.cacheMinFreeGi" (dict "root" $ "volume" .)) -}}
      {{- $_ := set $minFreeByVolume .name $minFreeString -}}
    {{- end -}}

    {{- /* Builds the set of cache zone names whose backends are enabled, except registry, which has no server here. */}}
    {{- $enabledCacheNames := dict }}
    {{- range $key, $backend := .Values.nginx.backends }}
      {{- if and $backend.include (ne $key "registry") }}
        {{- $_ := set $enabledCacheNames $backend.proxyCacheName true }}
      {{- end }}
    {{- end }}

    {{- /* Generates NGINX proxy_cache_path entries only for enabled backends. */}}
    {{- range .Values.nginx.proxyCache.paths }}
    {{- if hasKey $enabledCacheNames .name }}
    # Configuration for cache path: {{ .name }}
    proxy_cache_path {{ include "func.effectiveProxyCachePath" (dict "root" $ "cachePath" .) | quote }}
                     levels={{ default "1:2" .levels }}
                     keys_zone={{ .name }}:{{ default "256m" .metadataMemorySize }}
                     inactive={{ default "1d" .maxIdleTime }}
                     {{- if .maxSizeGi }}
                     max_size={{ printf "%dg" (int .maxSizeGi) }}
                     {{- end }}
                     {{- with get $minFreeByVolume .name }}
                     min_free={{ . }} {{- /* If found, use the formatted value */}}
                     {{- end }}
                     use_temp_path=off;
    {{- end }}
    {{- end }}

    # Health check endpoint.
    server {
        listen 13129;
        access_log off;
{{- if (.Values.traces).enabled }}
        otel_trace on;
        otel_trace_context propagate;
{{- end }}

        location /healthz {
            add_header Content-Type text/plain;
            return 200 "healthy\n";
        }
        location / {
            return 404 "Not Found\n";
        }
    }

    # Metrics endpoint.
    server {
        listen 9145;
        access_log off;

        location /cache_metrics {
            content_by_lua_block {
                local metrics = require("lua-metrics")

                metrics.gauge.connections:set(ngx.var.connections_reading, {"reading"})
                metrics.gauge.connections:set(ngx.var.connections_writing, {"writing"})
                metrics.gauge.connections:set(ngx.var.connections_waiting, {"waiting"})
                metrics.gauge.connections:set(ngx.var.connections_active, {"active"})

                metrics.counter.poll_total:inc(1)
                metrics.report_on_dict("presigned_url_cache", ngx.shared.presigned_url_cache)
                metrics.report_on_dict("lock_by_request_uri_table", ngx.shared.lock_by_request_uri_table)
                metrics.report_on_dict("cache_metrics", ngx.shared.cache_metrics)

                metrics.prometheus:collect()
            }
        }
        location = /metrics {
            return 404 "Not Found\n";
        }
        location /nginx_status {
            stub_status on;
            allow 127.0.0.1;
            deny all;
        }
        location / {
            return 404 "Not Found\n";
        }
    }

    #
    # Client -> NGINX Connection Settings
    #

    {{- if .Values.tls.enabled }}
    # Enables HTTPS between client and NGINX.
    ssl_certificate /etc/nginx/ssl/tls.crt;
    ssl_certificate_key /etc/nginx/ssl/tls.key;

    # TLS versions offered to clients. Default is TLS 1.3-only (hardened).
    # Override to "TLSv1.2 TLSv1.3" for deployments that must serve clients whose
    # TLS stack cannot negotiate 1.3 -- notably .NET Framework's
    # System.Net.WebClient (e.g. packman's Windows bootstrap downloader), which
    # fails against a 1.3-only endpoint with "Could not create SSL/TLS secure
    # channel". TLS 1.2 is still secure; only 1.0/1.1 are deprecated.
    ssl_protocols {{ .Values.tls.sslProtocols | default "TLSv1.3" }};

    {{- if .Values.tls.autoReloadSecret }}
    ssl_certificate_by_lua_block {
        require("lua-cert-reload").apply()
    }
    {{- end }}
    {{- end }}

    # Sets client body size limit to 0 (unlimited). Disables request buffering, streaming
    # uploads directly to the backend-reduces NGINX memory/latency but holds backend connection.
    client_max_body_size 0;

    # Immediately frees resources by forcefully closing connections to clients that time out
    # (RST), helping prevent resource exhaustion from slow or unresponsive clients.
    reset_timedout_connection on;

    #
    # NGINX Internal Processing
    #

    # Do not error or warn when variables from ngx.var are used but not set.
    # This makes ngx.var.FOO access for variables not yet defined simply return
    # nil or "" instead of an error. This is what happens for other variables.
    #
    # This allows variables to for shared scripts to be set only for the servers
    # that need to use them.
    uninitialized_variable_warn off;

    # Requires an explicit Content-Type from the Lua handler; does not supply one.
    lua_use_default_type off;

    {{- if and .Values.nginx.lua.debug }}
    lua_code_cache off;
    {{- end }}

    # Sets DNS resolver and timeout for dynamic upstream hostname resolution.
    resolver {{ $.Values.nginx.resolver.config }};
    resolver_timeout {{ $.Values.nginx.resolver.timeoutSecs }}s;

    # Sets trusted CA bundle for Lua (e.g., lua-resty-http) scripts making outbound HTTPS
    # calls, allowing certificate verification when Lua connects to backends.
    lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    lua_ssl_verify_depth {{ $.Values.nginx.sslVerifyDepth }};

    #
    # NGINX -> Backend Connection Behavior
    #

    {{- if $.Values.featureFlags.ignoreClientAbort }}
    # Continues the upstream download if a client disconnects mid-transfer.
    # This populates the cache so other clients get a fast cache hit instead of
    # re-triggering a slow download from the origin.
    proxy_ignore_client_abort on;
    {{- end }}

    # Enables response buffering to quickly read backend responses into memory, freeing backend
    # connections for reuse. Critical for efficient connection pooling. Default is `on`.
    proxy_buffering on;

    # Allocates buffers for proxied responses. Sized for p90 object distribution to minimize
    # backend connection hold time during cache warmup. Default is `8 4k` or `8 8k`.
    proxy_buffers {{ $.Values.nginx.proxyBuffers.count | default 16 }} {{ $.Values.nginx.proxyBuffers.size | default "256k" }};

    # Sets buffer size for reading response headers from backends. Default is `4k` or `8k`.
    proxy_buffer_size {{ $.Values.nginx.proxyBufferSize | default "128k" }};

    # Limits total buffer size that can be busy sending to clients while still receiving from
    # backends. Default is typically `2 * proxy_buffer_size`.
    proxy_busy_buffers_size {{ $.Values.nginx.proxyBusyBuffersSize | default "512k" }};

    # Maximum size for temporary files when responses exceed buffer capacity. Protects burst
    # storage credits by keeping most responses in memory. Default is `1024m`.
    proxy_max_temp_file_size {{ $.Values.nginx.proxyMaxTempFileSize | default "4096m" }};

    # Sets chunk size for writing overflowed data to temporary files. Larger chunks reduce disk
    # I/O overhead. Default is typically `8k` or `16k`.
    proxy_temp_file_write_size {{ $.Values.nginx.proxyTempFileWriteSize | default "1024k" }};

    # Disables request buffering, streaming uploads directly to backend; reduces NGINX
    # memory/latency but holds the backend connection. Paired with 'client_max_body_size 0'.
    proxy_request_buffering off;

    # Uses HTTP/1.1 for proxy connections, enabling features like keep-alive. Default is `1.0`.
    proxy_http_version 1.1;

    # Enables conditional GET revalidation (e.g., If-Modified-Since) to efficiently
    # revalidate cached resources without re-downloading. If upstream returns 304
    # Not Modified, the cached entry is refreshed without transferring the body.
    # Default is `off`.
    proxy_cache_revalidate on;

    # Only one request populates a new cache key while others wait.
    proxy_cache_lock on;
    proxy_cache_lock_age {{ $.Values.nginx.proxyCache.lockAge }};
    proxy_cache_lock_timeout {{ $.Values.nginx.proxyCache.lockTimeout }};

    # Prevents HEAD requests from being converted to GET for caching purposes.
    # This preserves the original HTTP method for AWS SigV4 signature validation.
    proxy_cache_convert_head off;

    #
    # NGINX -> Backend Connection Security
    #

    # Enforces TLS certificate verification for proxied HTTPS connections using system CAs,
    # securing the communication channel from NGINX to the backend.
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth {{ $.Values.nginx.sslVerifyDepth }};

    # When `proxy_pass` uses a variable (e.g., for dynamic resolution with a `resolver`),
    # NGINX does not send the Server Name Indication (SNI) by default. The upstream
    # server might require SNI to correctly terminate the TLS handshake. Without this
    # directive, the connection fails with an "sslv3 alert handshake failure".
    proxy_ssl_server_name on;

    # Enables backend SSL session reuse (default 'on') for significantly improved performance
    # by resuming TLS sessions. For modern backends (e.g., S3/Azure/GCP) using strong TLS,
    # historical compatibility or minor theoretical security reasons for 'off' are negligible.
    proxy_ssl_session_reuse on;

    #
    # NGINX -> Backend Header Forwarding
    #

    # Forwards most client request headers, excluding hop-by-hop ones, to the backend.
    proxy_pass_request_headers on;

    # Explicitly forwards 'If-Match' header, crucial for backend conditional requests or
    # signature validation (e.g., S3 presigned URLs, SAS tokens).
    {{- include "func.upstreamCacheRequestHeaders" . | nindent 4 }}

    #
    # NGINX -> Client Response Optimization
    #

    # Enables efficient file transfers from disk using zero-copy kernel calls.
    sendfile on;

    # Bundles HTTP response headers and file start in one packet when sendfile is active.
    tcp_nopush on;

    # Enables async file I/O via thread pools for disk reads when sendfile isn't used/effective.
    # Performance impact requires measurement.
    aio threads;

    #
    # NGINX -> Client Response Configuration
    #

    # Adds X-Cache-Status header (e.g., HIT, MISS, BYPASS) to responses; 'always' includes errors.
    add_header X-Cache-Status $upstream_cache_status always;


    #
    # NGINX -> Upstream Connection Pooling Configuration
    #

    # Specifies the size limit (in terms of connection count) for every cosocket
    # connection pool associated with every remote server.
    # Limit the total number of possible (outbound/upstream) connections.
    lua_socket_pool_size {{ $.Values.nginx.socketPoolSize }};

    # Default keepalive timeout.
    lua_socket_keepalive_timeout "{{ $.Values.nginx.upstreamBalancer.keepalive.idleTimeoutSecs }}s";

    upstream dyn_upstream {
        server 0.0.0.1:1234;   # just an invalid address as a place holder

        balancer_by_lua_block {
            local balancer = require "ngx.balancer"
            local peer = ngx.ctx.upstream_peer
            if peer == nil then
                ngx.log(ngx.ERR, "❌ no peer address available to route upstream, this is `resolve_for_keepalive`'s responsibility")
                return ngx.exit(ngx.HTTP_INTERNAL_SERVER_ERROR)
            end

            -- Sets TLS mode before peer to ensure `set_current_peer` copies hostname for SNI.
            balancer.set_upstream_tls(peer.is_tls)
            local ok, err = balancer.set_current_peer(peer.ip, peer.port, peer.hostname)
            if not ok then
                ngx.log(ngx.ERR, "❌ failed to set the current peer: ", err)
                return ngx.exit(ngx.HTTP_INTERNAL_SERVER_ERROR)
            end
            balancer.enable_keepalive({{ $.Values.nginx.upstreamBalancer.keepalive.idleTimeoutSecs }}, {{ $.Values.nginx.upstreamBalancer.keepalive.maxRequestsPerConnection }})
        }

        # Maximum cached idle connections per worker. Must match balancer_keepalive
        # to avoid limiting the pool size. Both directives control connection pooling
        # when using balancer_by_lua_block.
        keepalive {{ $.Values.nginx.upstreamBalancer.keepalive.maxCachedConnectionsPerWorker }};
        balancer_keepalive {{ $.Values.nginx.upstreamBalancer.keepalive.maxCachedConnectionsPerWorker }};
    }

    #
    # Supported Backend Servers
    #

    include /etc/nginx/conf.d/sites/azure-server.conf;
    include /etc/nginx/conf.d/sites/s3-server.conf;
    include /etc/nginx/conf.d/sites/gcs-server.conf;
    include /etc/nginx/conf.d/sites/nucleus-server.conf;
    # Requests targeting nginx's own hostname(s) — return 421 instead of proxying.
    include /etc/nginx/conf.d/sites/self-server.conf;
    # Else, if none of the Backend Servers defined above match the requested hostname.
    include /etc/nginx/conf.d/sites/passthrough-server.conf;
}

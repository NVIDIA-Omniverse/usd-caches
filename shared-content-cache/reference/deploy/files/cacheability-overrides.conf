# Upstream backends may return headers that make otherwise immutable content
# uncacheable under NGINX defaults. GCS returns "Cache-Control: private,
# max-age=0". S3 and Azure objects may carry Cache-Control metadata. Package
# registries and CDNs may return Set-Cookie on immutable artifacts.
#
# OVCC owns cacheability through proxy_cache_valid for these backends, so ignore
# upstream cacheability headers that would otherwise prevent storing a response.
proxy_ignore_headers Cache-Control Expires Set-Cookie;

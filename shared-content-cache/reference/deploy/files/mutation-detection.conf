# Mutation detection for when `requiresVersioning` is false.
# Runs in header_filter phase after proxy_pass returns the response.
#
# Compares cached Last-Modified from proxy_cache with upstream Last-Modified
# captured during access phase. If upstream is newer, the cache entry is stale.
#
# On detection, purges the stale cache entry and returns 503 to signal the
# client to retry. The retry will fetch fresh content since the cache was purged.
# 503 (not 429) because aws-sdk-s3 only retries 5xx transient errors.
#
# Requires `$upstream_etag` and `$upstream_last_modified` variables defined in
# the location block.

header_filter_by_lua_block {
    require("lua-mutation").detect()
}

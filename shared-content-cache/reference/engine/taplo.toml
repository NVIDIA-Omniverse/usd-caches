include = ["**/*.toml"]
exclude = ["**/target/**"]

[formatting]
align_entries = false
align_comments = true
array_trailing_comma = true
array_auto_expand = true
array_auto_collapse = true
column_width = 100
compact_arrays = true
compact_inline_tables = false
indent_string = "    "
trailing_newline = true
reorder_keys = false
reorder_arrays = false

[package]
name = "ovcc-cache"
description = "OVCC cache engine: single-flight lookup/fill over a Storage backend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ovcc-core = { version = "0.1.0", path = "../ovcc-core" }
ovcc-cachekey = { version = "0.1.0", path = "../ovcc-cachekey" }
ovcc-refmap = { version = "0.1.0", path = "../ovcc-refmap" }
ovcc-storage = { version = "0.1.0", path = "../ovcc-storage" }
parking_lot.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time"] }

[dev-dependencies]
ovcc-platform = { version = "0.1.0", path = "../ovcc-platform" }
criterion = { workspace = true, features = ["async_tokio"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "test-util"] }

[[bench]]
name = "cache"
harness = false

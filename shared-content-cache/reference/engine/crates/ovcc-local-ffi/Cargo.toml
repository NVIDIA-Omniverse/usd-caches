[package]
name = "ovcc-local-ffi"
description = "Experimental native bridge for OVCC Python and C++ path clients."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
ovcc-local = { version = "0.1.0", path = "../ovcc-local" }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }

[dev-dependencies]
ovcc-platform = { version = "0.1.0", path = "../ovcc-platform" }

[package]
name = "ovcc-upstream"
description = "Origin/upstream HTTP client for OVCC (plaintext or TLS)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bench]]
name = "upstream"
harness = false

[features]
default = []
test-fault-injection = ["dep:ovcc-testing"]

[dependencies]
bytes.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-rustls = { workspace = true, features = ["http1"] }
hyper-util = { workspace = true, features = ["client", "client-legacy", "tokio", "http1"] }
ovcc-core = { version = "0.1.0", path = "../ovcc-core" }
ovcc-platform = { version = "0.1.0", path = "../ovcc-platform" }
ovcc-telemetry = { version = "0.1.0", path = "../ovcc-telemetry" }
ovcc-testing = { version = "0.1.0", path = "../ovcc-testing", optional = true }
ovcc-tls = { version = "0.1.0", path = "../ovcc-tls" }
rustls.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
tower-service.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
criterion.workspace = true
rcgen = { workspace = true, features = ["pem"] }
serde_json.workspace = true
tokio-rustls.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[[bench]]
name = "origin_body"
harness = false

# Builds the Sphinx documentation on every push and pull request, and deploys it
# to GitHub Pages on pushes to main and on manual runs, which the github-pages
# environment still limits to its allowed branches. Pull requests only build,
# with a read-only token.
name: Build and Deploy Docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Let a deployment finish; only superseded pull request builds are cancelled.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Build documentation
        working-directory: docs
        run: make html

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/_build/html

  deploy:
    # Never deploy from a pull request. The github-pages environment only admits
    # the branches it lists, so a manual run elsewhere is rejected there.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    # Grant GITHUB_TOKEN only what a Pages deployment needs.
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

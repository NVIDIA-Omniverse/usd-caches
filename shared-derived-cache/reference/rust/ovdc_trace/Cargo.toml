[package]
name = "ovdc_trace"
version = "0.1.0"
edition = "2021"
description = "Provides an agnostic networking implementation for the OSS KV"
license = "Apache-2.0"
repository = "https://github.com/NVIDIA-Omniverse/usd-caches-internal/tree/main/shared-derived-cache/reference"
publish = false

[dependencies]
tracing.workspace = true
pastey.workspace = true
tokio.workspace = true
serde.workspace = true
bytes.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["http1"] }
hyper-util.workspace = true

ovdc_bytes = { path = "../ovdc_bytes" }
ovdc_settings = { path = "../ovdc_settings" }

tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
http.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk = { workspace = true, features = ["experimental_metrics_custom_reader"] }
opentelemetry-otlp.workspace = true
opentelemetry-appender-tracing.workspace = true

[dev-dependencies]

{{/*
The application's settings file, mirroring rust/ovdc/src/config.toml.

Values are rendered with `toJson` rather than interpolated directly: JSON
scalar syntax is a subset of TOML, so integers render without an exponent
(`4000000`, not `4e+06`), floats keep their precision, strings are quoted,
and lists render as TOML arrays. Plain `{{ .Values.x }}` interpolation must
not be used here — Helm parses values.yaml numbers as float64 and formats
large ones in exponent notation, which the settings deserialiser rejects.

When adding a setting to rust/ovdc/src/config.toml, add it here too.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ovdc.fullname" . }}
  labels:
    {{- include "ovdc.labels" . | nindent 4 }}
    {{- with .Values.global.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  config.toml: |
    # Generated by the ovdc Helm chart. Do not edit in place; the container
    # reloads this file, so changes are picked up but will be overwritten on
    # the next `helm upgrade`.

    # Allowed values are json, human, human_no_color
    logFormat = {{ .Values.settings.logFormat | toJson }}
    # Log level for stdout fmt layer. Allowed values: "error", "warn", "info", "debug", "trace", "off"
    logLevel = {{ .Values.settings.logLevel | toJson }}
    # Per-module level overrides for the stdout sink, layered on top of logLevel.
    # Format: module[*]=level[,module2[*]=level2]...
    logFilter = {{ .Values.settings.logFilter | toJson }}

    # Configure additional storage settings.
    [store]
    # The maximum on-disk size the DB will target.
    {{- if eq (upper (.Values.settings.store.maxSize | toString)) "AUTO" }}
    # AUTO: derived from storage.volume.size ({{ .Values.storage.volume.size }})
    # less min(20%, 100GB) of headroom.
    maxSize = {{ include "ovdc.autoMaxSizeBytes" . }}
    {{- else }}
    maxSize = {{ .Values.settings.store.maxSize | toJson }}
    {{- end }}
    # The size after which values will be split up.
    blobCutoff = {{ .Values.settings.store.blobCutoff | toJson }}
    # The size by which to split values by.
    blobChunkSize = {{ .Values.settings.store.blobChunkSize | toJson }}
    # Engine to use when storing files.
    mode = {{ .Values.settings.store.mode | toJson }}

    {{- /*
    presets.cpu/presets.ram, when set, override a fixed set of engine values
    below instead of settings.engine as written -- see ovdc.cpuPreset /
    ovdc.ramPreset in _helpers.tpl for the tables. Both are nil (empty dict)
    when their preset is unset, leaving settings.engine untouched.
    */}}
    {{- $cpu := dict }}
    {{- if not (empty .Values.presets.cpu) }}
    {{- $cpu = include "ovdc.cpuPreset" .Values.presets.cpu | fromYaml }}
    {{- end }}
    {{- $ram := dict }}
    {{- if not (empty .Values.presets.ram) }}
    {{- $ram = include "ovdc.ramPreset" .Values.presets.ram | fromYaml }}
    {{- end }}
    {{- $blobsCfRamOverride := dict }}
    {{- if hasKey $ram "blobsCfMaxWriteBufferNumber" }}
    {{- $blobsCfRamOverride = dict "max_write_buffer_number" $ram.blobsCfMaxWriteBufferNumber }}
    {{- end }}
    {{- /*
    More vCPUs than the cpuPreset table's subcompaction-worthy threshold
    means there are idle background threads a single compaction can't use
    on its own -- split it across more parallel sub-ranges so it actually
    uses them, instead of leaving settings.engine.db.max_subcompactions at
    its (lower) written value.
    */}}
    {{- $dbCpuOverride := dict }}
    {{- if and (not (empty .Values.presets.cpu)) (gt (int .Values.presets.cpu) 4) }}
    {{- $dbCpuOverride = dict "max_subcompactions" 4 }}
    {{- end }}

    # Engine specific configuration.
    [engine]
    useWriteBufferManager = {{ .Values.settings.engine.useWriteBufferManager | toJson }}
    cacheSize = {{ (default .Values.settings.engine.cacheSize $ram.cacheSize) | toJson }}
    blockCacheSize = {{ (default .Values.settings.engine.blockCacheSize $ram.blockCacheSize) | toJson }}
    increaseParallelism = {{ (default .Values.settings.engine.increaseParallelism $cpu.increaseParallelism) | toJson }}
    threadsHigh = {{ (default .Values.settings.engine.threadsHigh $cpu.threadsHigh) | toJson }}
    threadsLow = {{ (default .Values.settings.engine.threadsLow $cpu.threadsLow) | toJson }}

    {{- /*
    Passed through verbatim to RocksDB; arbitrary options may be added in
    values.yaml. $dbCpuOverride takes precedence over settings.engine.db
    when presets.cpu > 4.
    */}}
    {{- range $key, $value := merge (dict) $dbCpuOverride .Values.settings.engine.db }}
    db.{{ $key }} = {{ $value | toJson }}
    {{- end }}

    {{- range $key, $value := .Values.settings.engine.cf }}
    cf.{{ $key }} = {{ $value | toJson }}
    {{- end }}

    {{- range $key, $value := .Values.settings.engine.block }}
    block.{{ $key }} = {{ $value | toJson }}
    {{- end }}

    {{- /*
    The 'blobs' column family, which in store.mode "log" holds every value above
    store.blobCutoff. Separate from cf/block above, which configure 'default'.
    Empty by default, so the CF takes RocksDB's own defaults. $blobsCfRamOverride
    takes precedence over settings.engine.blobsCf when presets.ram is set.
    */}}
    {{- range $key, $value := merge (dict) $blobsCfRamOverride .Values.settings.engine.blobsCf }}
    blobsCf.{{ $key }} = {{ $value | toJson }}
    {{- end }}

    {{- range $key, $value := .Values.settings.engine.blobsBlock }}
    blobsBlock.{{ $key }} = {{ $value | toJson }}
    {{- end }}

    # Configuration for garbage collection.
    [garbageCollection]
    # The minimum free capacity target for the target map.
    # If the percentage of free map space falls below the given amount, GC will begin.
    minFreeCapacity = {{ .Values.settings.garbageCollection.minFreeCapacity | toJson }}
    # Once GC begins, the system will attempt to remove the given quantile of the entire keyspace.
    # If this number is 60, then 60% of keys will be deleted.
    deleteKeyspaceQuantile = {{ .Values.settings.garbageCollection.deleteKeyspaceQuantile | toJson }}
    # How long, in seconds, to wait after a GC pass finishes before checking free capacity again.
    cooldownSecs = {{ .Values.settings.garbageCollection.cooldownSecs | toJson }}

    # Provides the ability to export to OTEL and prometheus.
    [telemetry]
    prometheusMetricsExposition = {{ .Values.settings.telemetry.prometheusMetricsExposition | toJson }}
    prometheusMetricsPort = {{ .Values.settings.telemetry.prometheusMetricsPort | toJson }}

    # Main configuration for OpenTelemetry integration.
    [otel]
    # Both keys are required by the config schema but neither is acted on:
    # `enabled` is read and discarded, and OTEL_* environment overrides are
    # applied regardless of `useEnvVars`. Disable export with
    # `exporter = "none"` in the sections below.
    enabled = {{ .Values.settings.otel.enabled | toJson }}
    useEnvVars = {{ .Values.settings.otel.useEnvVars | toJson }}

    # Configuration for distributed tracing.
    [otelTraces]
    # The exporter to use. Acceptable values: "otlp", "console", "none".
    exporter = {{ .Values.settings.otelTraces.exporter | toJson }}

    # The OTLP export protocol.
    otlp.protocol = {{ .Values.settings.otelTraces.otlp.protocol | toJson }}
    # The OTLP URI for exposition.
    otlp.endpoint = {{ .Values.settings.otelTraces.otlp.endpoint | toJson }}
    # The timeout duration for OTLP export requests.
    otlp.timeout = {{ .Values.settings.otelTraces.otlp.timeout | toJson }}
    # The delay in milliseconds between batch export attempts.
    processor.scheduleDelay = {{ .Values.settings.otelTraces.processor.scheduleDelay | toJson }}
    # The maximum number of items to queue before dropping new items.
    processor.maxQueueSize = {{ .Values.settings.otelTraces.processor.maxQueueSize | toJson }}
    # The maximum number of items to include in a single batch export.
    processor.maxBatchSize = {{ .Values.settings.otelTraces.processor.maxBatchSize | toJson }}

    # Maximum length in bytes for span attribute values. Longer values are truncated.
    attributeValueLengthLimit = {{ .Values.settings.otelTraces.attributeValueLengthLimit | toJson }}
    # Maximum number of attributes allowed per span.
    attributeCountLimit = {{ .Values.settings.otelTraces.attributeCountLimit | toJson }}
    # Maximum number of events allowed per span.
    eventCountLimit = {{ .Values.settings.otelTraces.eventCountLimit | toJson }}
    # Maximum number of links allowed per span.
    linkCountLimit = {{ .Values.settings.otelTraces.linkCountLimit | toJson }}
    # Maximum number of attributes allowed per span event.
    eventAttributeCountLimit = {{ .Values.settings.otelTraces.eventAttributeCountLimit | toJson }}
    # Maximum number of attributes allowed per span link.
    linkAttributeCountLimit = {{ .Values.settings.otelTraces.linkAttributeCountLimit | toJson }}
    # Required by the config schema, but nothing reads them: sampling is not
    # applied. Do not remove — the application panics if they are absent.
    samplerArg = {{ .Values.settings.otelTraces.samplerArg | toJson }}
    sampler = {{ .Values.settings.otelTraces.sampler | toJson }}
    # Base level for events forwarded to the span exporter, independent of logLevel
    # and otelLogs.level.
    level = {{ .Values.settings.otelTraces.level | toJson }}
    # Per-module level overrides layered on top of `level`. Format: module[*]=level[,...].
    filter = {{ .Values.settings.otelTraces.filter | toJson }}

    # Configuration for distributed logs.
    [otelLogs]
    # The exporter to use. Acceptable values: "otlp", "console", "none".
    exporter = {{ .Values.settings.otelLogs.exporter | toJson }}

    # The OTLP export protocol.
    otlp.protocol = {{ .Values.settings.otelLogs.otlp.protocol | toJson }}
    # The OTLP URI for exposition.
    otlp.endpoint = {{ .Values.settings.otelLogs.otlp.endpoint | toJson }}
    # The timeout duration for OTLP export requests.
    otlp.timeout = {{ .Values.settings.otelLogs.otlp.timeout | toJson }}
    # The delay in milliseconds between batch export attempts.
    processor.scheduleDelay = {{ .Values.settings.otelLogs.processor.scheduleDelay | toJson }}
    # The maximum number of items to queue before dropping new items.
    processor.maxQueueSize = {{ .Values.settings.otelLogs.processor.maxQueueSize | toJson }}
    # The maximum number of items to include in a single batch export.
    processor.maxBatchSize = {{ .Values.settings.otelLogs.processor.maxBatchSize | toJson }}

    # Maximum length in bytes for log attribute values. Longer values are truncated.
    attributeValueLengthLimit = {{ .Values.settings.otelLogs.attributeValueLengthLimit | toJson }}
    # Maximum number of attributes allowed per log record.
    attributeCountLimit = {{ .Values.settings.otelLogs.attributeCountLimit | toJson }}
    # Base level for events forwarded to the log exporter, independent of logLevel
    # and otelTraces.level.
    level = {{ .Values.settings.otelLogs.level | toJson }}
    # Per-module level overrides layered on top of `level`. Format: module[*]=level[,...].
    filter = {{ .Values.settings.otelLogs.filter | toJson }}

    # Configuration for metrics.
    [otelMetrics]
    # The exporter to use. Acceptable values: "otlp", "console", "none".
    exporter = {{ .Values.settings.otelMetrics.exporter | toJson }}

    # The OTLP export protocol.
    otlp.protocol = {{ .Values.settings.otelMetrics.otlp.protocol | toJson }}
    # The OTLP URI for exposition.
    otlp.endpoint = {{ .Values.settings.otelMetrics.otlp.endpoint | toJson }}
    # The timeout duration for OTLP export requests.
    otlp.timeout = {{ .Values.settings.otelMetrics.otlp.timeout | toJson }}
    # The delay in milliseconds between export attempts.
    processor.interval = {{ .Values.settings.otelMetrics.processor.interval | toJson }}
    # Which events reach the metrics exporter. Format: global[,module[*]=level].
    filter = {{ .Values.settings.otelMetrics.filter | toJson }}

    # Configure the GRPC HTTP service.
    [grpc]
    # The port at which to serve the GRPC service.
    port = {{ .Values.settings.grpc.port | toJson }}
    # Set the initial HTTP2 stream window size. Must not be 0.
    initialStreamWindowSize = {{ .Values.settings.grpc.initialStreamWindowSize | toJson }}
    # Set the initial HTTP2 connection window size. Must not be 0.
    initialConnectionWindowSize = {{ .Values.settings.grpc.initialConnectionWindowSize | toJson }}
    # Max number of requests that can be operated on concurrently per connection. Must not be 0.
    connectionConcurrencyLimit = {{ .Values.settings.grpc.connectionConcurrencyLimit | toJson }}
    # Max number of HTTP2 streams per connection. 0 for unlimited.
    maxConcurrentStreams = {{ .Values.settings.grpc.maxConcurrentStreams | toJson }}
    # Max frame size for each HTTP2 data frame. 0 for HTTP2 default.
    maxFrameSize = {{ .Values.settings.grpc.maxFrameSize | toJson }}
    # Max time that a request can take. Must not be 0.
    timeout = {{ .Values.settings.grpc.timeout | toJson }}
    # The amount of time to wait before timing out a proto buf write.
    writeTimeout = {{ .Values.settings.grpc.writeTimeout | toJson }}
    # The amount of time in seconds before keepalive probes are sent.
    tcpKeepaliveAfterIdleTime = {{ .Values.settings.grpc.tcpKeepaliveAfterIdleTime | toJson }}
    # The amount of time between each keepalive probe.
    tcpKeepaliveInterval = {{ .Values.settings.grpc.tcpKeepaliveInterval | toJson }}
    # The number of probes to send before the socket is considered reset.
    tcpKeepaliveRetries = {{ .Values.settings.grpc.tcpKeepaliveRetries | toJson }}
    # The amount of time to wait between http2 keepalive probes.
    http2KeepaliveInterval = {{ .Values.settings.grpc.http2KeepaliveInterval | toJson }}
    # The amount of time to wait before connection is considered reset.
    http2KeepaliveTimeout = {{ .Values.settings.grpc.http2KeepaliveTimeout | toJson }}
    # If true a tenant ID can be set through a string set in the metadata.
    tenantFromMetadata = {{ .Values.settings.grpc.tenantFromMetadata | toJson }}
    # The max size that the GRPC service will allow.
    maxDecodingMessageSize = {{ .Values.settings.grpc.maxDecodingMessageSize | toJson }}
    # Max time that a single PUT stream can run for. Capped at 4h by the binary;
    # a larger value is logged as an error and treated as 4h rather than refused.
    putTimeout = {{ .Values.settings.grpc.putTimeout | toJson }}

    # Configuration for TLS properties for GRPC.
    #
    # The certificate paths are fixed by the chart and are not configurable:
    # they must match where the secret named by settings.grpcTls.secretName is
    # mounted. Filenames follow the kubernetes.io/tls convention.
    [grpcTls]
    # If true the tonic server will require TLS.
    enabled = {{ .Values.settings.grpcTls.enabled | toJson }}
    # The path for the client certificate to use.
    cert = {{ printf "%s/tls.crt" (include "ovdc.tlsMountPath" .) | toJson }}
    # The path for the key of the client certificate.
    key = {{ printf "%s/tls.key" (include "ovdc.tlsMountPath" .) | toJson }}
    # If true the ca root path provided will be used as the ca root for the TLS cert.
    includeCaRoot = {{ .Values.settings.grpcTls.includeCaRoot | toJson }}
    # The path to use for the ca root, only used if `includeCaRoot` is true.
    caRoot = {{ printf "%s/ca.crt" (include "ovdc.tlsMountPath" .) | toJson }}

    # Configuration for JWT for GRPC.
    [grpcJwt]
    # If true the tonic server will verify JWTs provided to the service.
    enabled = {{ .Values.settings.grpcJwt.enabled | toJson }}
    # If true, a valid JWT is required for requests to succeed.
    require = {{ .Values.settings.grpcJwt.require | toJson }}
    # Url for public JWK set.
    jwkPublicKeysetUrl = {{ .Values.settings.grpcJwt.jwkPublicKeysetUrl | toJson }}
    # The amount of time to wait before requesting a JWK set from the given url.
    jwkUpdateIntervalSecs = {{ .Values.settings.grpcJwt.jwkUpdateIntervalSecs | toJson }}
    # The amount of bytes to consume to cache JWTs across connections.
    cacheSizeMb = {{ .Values.settings.grpcJwt.cacheSizeMb | toJson }}
    # When true the aud claim of the token is verified.
    verifyAud = {{ .Values.settings.grpcJwt.verifyAud | toJson }}
    # Tokens will be required to have this value as their audience claim.
    audClaim = {{ .Values.settings.grpcJwt.audClaim | toJson }}
    # When true verifies the expiration time of provided JWT.
    verifyExp = {{ .Values.settings.grpcJwt.verifyExp | toJson }}

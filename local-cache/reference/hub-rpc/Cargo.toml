[package]
description = "NVIDIA Omniverse Hub RPC layer"
edition.workspace = true
name = "hub-rpc"
repository.workspace = true
rust-version.workspace = true
version = "1.0.0"

[lib]
path = "src/hub-rpc.rs"

[features]
default = []

[dependencies]
serde = { version = "1.0.204", features = ["derive", "rc"] }
uuid = { version = "1.10.0", features = ["serde", "v4"] }
prost = { version = "0.14.3" }
prost-types = { version = "0.14.3"}
bytes = "1.11.1"
tokio-serde = { version = "0.9.0" }

[build-dependencies]
prost-build = { version = "0.14.3" }

[target.'cfg(unix)'.build-dependencies]
# Vendored protoc compiler - compiles protoc from source
protobuf-src = "1.1"

# File descriptor set for reflection (generated at build time)
[package.metadata.hub-rpc]
# The FILE_DESCRIPTOR_SET is generated by build.rs

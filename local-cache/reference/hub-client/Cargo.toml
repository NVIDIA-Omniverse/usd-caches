[package]
description = "NVIDIA Omniverse Hub Client"
edition.workspace = true
name = "hub-client"
repository.workspace = true
rust-version.workspace = true
version = "1.1.0"

[lib]
crate-type = ["lib", "staticlib"]
name = "hub_client"
path = "src/hub-client.rs"

[features]
test = []

[build-dependencies]
# cbindgen ToT has the 'Builder::with_cpp_compat()' function we need, but it has not been released.
# Using ToT of cbindgen from git leads to build warnings because their repo contains duplicate packages.
# So use the latest released version and cbindgen.toml for now
cbindgen = "0.26.0"

[dependencies]
fd-lock = "4.0.2"
file-rotate = "0.7.6"
flume = "0.11.0"
futures = "0.3.30"
hub-rpc = { path = "../hub-rpc" }
hub-util = { path = "../hub-util" }
libc = "0.2.155"
once_cell = "1.19.0"
parking_lot = "0.12.3"
pin-project = "1.1.13"
process_path = "0.1.4"
rand = "0.8.5"
semver = { version = "1.0.23", features = ["serde"] }
serde_json = "1.0.121"
stdext = "0.3.3"
thiserror = "1.0.63"
tokio = { version = "1.39.2", features = [
  "fs",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-serde = { version = "0.9.0", features = ["messagepack"] }
tokio-util = { version = "0.7.11", features = ["codec", "compat", "io-util"] }
tracing = { version = "0.1.40", features = ["attributes"] }
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.18", default-features = false, features = [
  "ansi",
  "env-filter",
  "fmt",
  "json",
  "parking_lot",
  "smallvec",
  "std",
  "time",
  "valuable",
] }
uuid = { version = "1.10.0", features = ["serde", "v4"] }
whoami = "1.5.1"
windows = { version = "0.52.0", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
positioned-io = "0.3.3"
temp-env = "0.3.6"
tempfile = "3.10.1"
test-log = { version = "0.2.16", features = ["trace"] }
